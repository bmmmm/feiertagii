<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>og.png – Vorlage</title>
<!-- Vorlage für og.png (1200×630). Gerendert von scripts/render-images.mjs, nicht Teil der Seite. -->
<style>
@font-face{font-family:"Barlow Condensed";font-weight:600;src:url(../fonts/barlow-condensed-600.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:700;src:url(../fonts/barlow-condensed-700.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:500;src:url(../fonts/ibm-plex-mono-500.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:600;src:url(../fonts/ibm-plex-mono-600.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-weight:400 600;src:url(../fonts/ibm-plex-sans-var.woff2) format("woff2")}
:root{--paper:#f2f4f7;--panel:#fff;--ink:#14171c;--muted:#5b6471;--rule:#dbe0e6;--red:#c8102e;--on-red:#fff;--red-ink:#a30c25}
*{box-sizing:border-box}
html,body{margin:0}
body{width:1200px;height:630px;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans",sans-serif;overflow:hidden}
.card{position:absolute;inset:36px;background:var(--panel);border:1px solid var(--rule);border-radius:22px;padding:58px 64px;display:flex;justify-content:space-between;gap:48px}
.l{display:flex;flex-direction:column;min-width:0}
.eyebrow{font:500 20px/1 "IBM Plex Mono",monospace;letter-spacing:.09em;text-transform:uppercase;color:var(--red-ink);margin:0}
h1{font:700 128px/.86 "Barlow Condensed",sans-serif;text-transform:uppercase;margin:22px 0 0;letter-spacing:-.005em}
.lede{font:500 26px/1.3 "IBM Plex Sans",sans-serif;color:var(--muted);margin:24px 0 0}
.ticks{display:flex;gap:5px;align-items:flex-end;margin-top:auto;height:44px}
.t{width:10px;height:32px;border-radius:3px;background:var(--ink);opacity:.82}
.t.we{width:7px;background:none}
.t.h{width:19px;height:44px;background:var(--red);opacity:1}
.sheet{flex:0 0 auto;align-self:center;width:290px;background:var(--red);color:var(--on-red);border-radius:9px 9px 18px 18px;text-align:center;padding:50px 22px 26px;position:relative;box-shadow:0 26px 46px -28px var(--red)}
.sheet::before{content:"";position:absolute;left:20px;right:20px;top:17px;height:12px;background:radial-gradient(circle,var(--panel) 4.4px,transparent 5.2px) 0 0/24px 12px space no-repeat}
.wd{font:600 22px "IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.16em}
.day{font:700 190px/.9 "Barlow Condensed",sans-serif}
.mon{font:600 38px/1 "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.07em}
.name{font:500 22px/1.3 "IBM Plex Sans",sans-serif;margin-top:20px;padding-top:15px;border-top:1px solid rgba(255,255,255,.4)}
</style>
</head>
<body>
<div class="card">
  <div class="l">
    <p class="eyebrow">Gesetzliche Feiertage · Montag bis Freitag</p>
    <h1>Werktags-<br>Feiertage</h1>
    <p class="lede">16 Bundesländer · 1991 bis 2070 · interaktiv</p>
    <div class="ticks" id="ticks"></div>
  </div>
  <div class="sheet">
    <div class="wd">Donnerstag</div>
    <div class="day">3</div>
    <div class="mon">Oktober</div>
    <div class="name">Tag der Deutschen Einheit</div>
  </div>
</div>
<script>
// Strichreihe wie auf der Seite: Montag, 16.09.2024 bis Donnerstag, 03.10.2024 – Strich = Arbeitstag, Lücke = Wochenende
let h='';for(let i=0;i<18;i++){const w=i%7;h+=`<i class="t${w>4?' we':i===17?' h':''}"></i>`;}
document.getElementById('ticks').innerHTML=h;
</script>
</body>
</html>
