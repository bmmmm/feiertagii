<!doctype html>

<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Seite nicht gefunden – Werktags-Feiertage</title>
<!-- GitHub Pages liefert diese Datei unter jedem unbekannten Pfad aus: Verweise deshalb über /feiertagii/, nie relativ -->
<link rel="icon" href="/feiertagii/favicon.ico" sizes="32x32">
<link rel="icon" type="image/svg+xml" href="/feiertagii/favicon.svg">
<style>
@font-face{font-family:"Barlow Condensed";font-weight:700;font-display:swap;src:url(/feiertagii/fonts/barlow-condensed-700.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:500;font-display:swap;src:url(/feiertagii/fonts/barlow-500.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:500;font-display:swap;src:url(/feiertagii/fonts/ibm-plex-mono-500.woff2) format("woff2")}
:root{--paper:#f3f2ee;--ink:#15181d;--muted:#576070;--sign:#0b2545}
@media (prefers-color-scheme:dark){:root{--paper:#0e1013;--ink:#eceef1;--muted:#9da4af;--sign:#12305a;color-scheme:dark}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font:500 17px/1.5 "Barlow",system-ui,-apple-system,"Segoe UI",sans-serif}
main{display:flex;flex-wrap:wrap;align-items:center;gap:28px 40px;padding:32px;max-width:780px}
main>div:last-child{flex:1 1 320px}
.board{background:#0c0d10;color:#f4f3ee;border-radius:12px;padding:18px 20px;min-width:200px}
.l{font:500 12px "IBM Plex Mono",ui-monospace,monospace;text-transform:uppercase;letter-spacing:.12em;color:#9ba1aa}
.flaps{display:flex;gap:4px;margin-top:10px}
.flaps b{display:grid;place-items:center;width:52px;height:74px;border-radius:5px;font:700 60px/1 "Barlow Condensed","Arial Narrow",sans-serif;background:linear-gradient(#2a2d33 0 49%,#060708 49% 51%,#1d2025 51%)}
.st{display:inline-block;margin-top:12px;font:500 12px "IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:#ff8a80;border:1px solid #5a2a2a;border-radius:4px;padding:4px 7px}
h1{font:700 46px/.95 "Barlow Condensed","Arial Narrow",sans-serif;margin:0;display:inline-block;background:var(--sign);color:#fff;padding:8px 14px;border-radius:7px}
p{margin:14px 0 0;color:var(--muted);max-width:42ch}
a{color:var(--ink);font-weight:500;text-decoration-thickness:2px;text-underline-offset:3px}
</style>
</head>
<body>
<main>
  <div class="board" aria-hidden="true"><div class="l">Gleis ?</div><div class="flaps"><b>4</b><b>0</b><b>4</b></div><span class="st">fällt aus</span></div>
  <div>
    <h1>Diese Haltestelle gibt es nicht</h1>
    <p>Unter dieser Adresse hält keine Linie. Das Liniennetz der Werktags-Feiertage liegt hier: <a href="/feiertagii/">bmmmm.github.io/feiertagii</a></p>
  </div>
</main>
</body>
</html>
