name: pages

# Veröffentlicht die Seite auf https://bmmmm.github.io/feiertagii/.
# Hochgeladen wird nicht der Checkout, sondern was scripts/build-site.sh
# zusammenstellt – README, AGENTS.md, scripts/ und docs/ bleiben draußen –,
# und erst, wenn scripts/check-site.sh das Ergebnis sauber findet.
# Voraussetzung: Pages-Quelle „GitHub Actions“ (build_type=workflow). Steht sie
# auf „Deploy from a branch“, antwortet deploy-pages mit einem nackten 404.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rechtslage gegen Golden-Datei
        run: node tests/holidays.test.mjs
      - name: Seite zusammenstellen
        run: scripts/build-site.sh _site
      - name: Seite prüfen
        run: scripts/check-site.sh _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
