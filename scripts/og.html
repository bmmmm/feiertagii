<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>og.png – Vorlage</title>
<!-- Vorlage für og.png (1200×630). Gerendert von scripts/render-images.mjs, nicht Teil der Seite.
     Ein Ausschnitt des Liniennetzes 2026: vier Gleise, jede Linie hält dort, wo ihr Feiertag gilt. -->
<style>
@font-face{font-family:"Barlow Condensed";font-weight:700;src:url(../fonts/barlow-condensed-700.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:600;src:url(../fonts/ibm-plex-mono-600.woff2) format("woff2")}
*{box-sizing:border-box}
html,body{margin:0}
body{width:1200px;height:630px;background:#0b2545;color:#fff;overflow:hidden;position:relative}
.top{position:absolute;left:64px;top:52px;display:flex;gap:28px;align-items:flex-start}
.hst{width:100px;height:100px;border-radius:50%;background:#ffd400;display:grid;place-items:center;font:700 70px/1 "Barlow Condensed",sans-serif;color:#00733a;box-shadow:0 0 0 5px #fff inset;flex:none}
.eyebrow{font:600 19px/1.2 "IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:#ffd400;margin:8px 0 0}
h1{font:700 124px/.9 "Barlow Condensed",sans-serif;margin:8px 0 0;letter-spacing:-.01em}
svg{position:absolute;left:0;top:262px}
.lab{font:600 19px "IBM Plex Mono",monospace;fill:#0b2545}
.sgt{font:700 17px "Barlow Condensed",sans-serif;text-anchor:middle;dominant-baseline:central}
.strip{position:absolute;left:0;right:0;bottom:0;height:18px;display:flex}
.strip i{flex:1}
</style>
</head>
<body>
<div class="top">
  <div class="hst">H</div>
  <div>
    <p class="eyebrow">Liniennetz der gesetzlichen Feiertage · 16 Länder · 1991–2070</p>
    <h1>Werktags-Feiertage</h1>
  </div>
</div>
<svg id="net" width="1200" height="330" viewBox="0 0 1200 330"></svg>
<div class="strip" id="strip"></div>
<script>
// Linienfarben und Signetformen wie in index.html (LN, SH); Halte 2026 für BY, NW, BE, SN
const L=[
 ['NJ','#0369A1','#fff','bund','BY NW BE SN'],['3K','#CA8A04','#111','teil','BY'],['FT','#7C3AED','#fff','teil','BE'],
 ['KF','#475569','#fff','bund','BY NW BE SN'],['OM','#16A34A','#111','bund','BY NW BE SN'],['TA','#EF4444','#111','bund','BY NW BE SN'],
 ['CH','#7DD3FC','#111','bund','BY NW BE SN'],['PM','#EA580C','#111','bund','BY NW BE SN'],['FL','#A21CAF','#fff','teil','BY NW sn'],
 ['MH','#1D4ED8','#fff','teil','by'],['TE','#111111','#FACC15','bund','BY NW BE SN'],['RT','#9F1239','#fff','teil','SN'],
 ['AH','#A8A29E','#111','teil','BY NW'],['BT','#78350F','#fff','teil','SN'],['W1','#C8102E','#fff','bund','BY NW BE SN'],['W2','#14532D','#fff','bund','BY NW BE SN']
];
const SH={bund:'<circle cx="16" cy="16" r="14.8"/>',teil:'<rect x="1.4" y="1.4" width="29.2" height="29.2" rx="5"/>'};
const G=['BY','NW','BE','SN'],x0=150,dx=(1200-64-x0-20)/(L.length-1),y0=30,ty=y=>96+y*52;
let s='';
G.forEach((g,i)=>{s+=`<line x1="64" x2="1136" y1="${ty(i)}" y2="${ty(i)}" stroke="#ffffff" stroke-opacity=".28" stroke-width="5" stroke-linecap="round"/>`;
 s+=`<rect x="64" y="${ty(i)-15}" width="52" height="30" rx="4" fill="#ffffff"/><text class="lab" x="90" y="${ty(i)+7}" text-anchor="middle">${g}</text>`;});
L.forEach(([c,bg,fg,cat,st],j)=>{const x=x0+j*dx,on=st.split(' '),idx=G.map(g=>on.includes(g)?2:on.includes(g.toLowerCase())?1:0);
 const last=Math.max(...idx.map((v,i)=>v?i:-1));
 if(last>=0)s+=`<line x1="${x}" x2="${x}" y1="${y0+16}" y2="${ty(last)}" stroke="${bg}" stroke-width="7" ${bg==='#111111'?'stroke-opacity=".9"':''}/>`;
 idx.forEach((v,i)=>{if(v===2)s+=`<circle cx="${x}" cy="${ty(i)}" r="9" fill="#fff" stroke="${bg==='#111111'?'#FACC15':bg}" stroke-width="5"/>`;
  else if(v===1)s+=`<path d="M${x} ${ty(i)-11}l11 11-11 11-11-11z" fill="#0b2545" stroke="${bg}" stroke-width="3" stroke-dasharray="4 3"/>`;});
 s+=`<svg x="${x-19}" y="${y0-19}" width="38" height="38" viewBox="0 0 32 32"><g fill="${bg}" stroke="#fff" stroke-width="${bg==='#111111'||bg==='#14532D'||bg==='#0369A1'?1.6:0}">${SH[cat]}</g><text class="sgt" x="16" y="16.6" fill="${fg}">${c}</text></svg>`;});
document.getElementById('net').innerHTML=s;
document.getElementById('strip').innerHTML=L.map(l=>`<i style="background:${l[1]}"></i>`).join('');
</script>
</body>
</html>
